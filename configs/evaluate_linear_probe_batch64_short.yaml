# Batch-size ablation evaluation config for the short linear probe.
# This config is for Task 54 evaluation and must not be run during Task 51.
# The output is a short-ablation metric, not final benchmark performance.
# Checkpoints are external artifacts and must not be committed.

seed: 0
mode: linear_probe
device: auto
batch_size: 128
num_workers: 2

checkpoint:
  # The linear-probe checkpoint stores classifier_state_dict only.
  path: /home/yeyee/research/04_models/SimCLR-Reproduction-and-Ablation/linear_probe_batch64_short/cifar10_linear_probe_batch64_short.pt
  # The frozen encoder must be reconstructed from the matching batch64 SimCLR checkpoint.
  simclr_path: /home/yeyee/research/04_models/SimCLR-Reproduction-and-Ablation/simclr_batch64_short/cifar10_simclr_batch64_short.pt

model:
  feature_dim: 512
  num_classes: 10

dataset:
  name: cifar10
  data_root: /home/yeyee/research/03_datasets/SimCLR-Reproduction-and-Ablation
  train: false
  download: false

output_path: results/tables/linear_probe_batch64_short_eval.csv
